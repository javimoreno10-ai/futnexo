name: Restaurar fotografias del catalogo
on:
  push:
    paths:
      - '.github/workflows/restaurar-fotografias.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Recuperar las 310 imagenes verificadas desde V3.62
        run: python3 tools/restore_catalog_images.py
      - name: Publicar las imagenes recuperadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/catalogo/
          if ! git diff --cached --quiet; then
            git commit -m "Restore 310 verified catalog images for V3.63"
            git push
          fi
